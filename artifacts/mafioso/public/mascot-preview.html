<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<title>Mascot Preview</title>
<style>
  body { background: #111; margin: 0; padding: 20px; font-family: sans-serif; }
  h1 { color: #e33; text-align: center; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1000px; margin: 0 auto; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 16px; text-align: center; }
  .card img { height: 220px; object-fit: contain; display: block; margin: 0 auto; }
  .label { color: #aaa; font-size: 12px; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .check { background: #1a2a1a; border-color: #2a5a2a; }
  .check .label { color: #4a4; }
</style>
</head>
<body>
<h1>🎩 Mascot Poses</h1>
<div class="grid">
  <div class="card"><img src="/mascot/mascot_pointing_right.webp"><div class="label">Pointing Right</div></div>
  <div class="card"><img src="/mascot/mascot_pointing_left.webp"><div class="label">Pointing Left</div></div>
  <div class="card"><img src="/mascot/mascot_welcome.webp"><div class="label">Welcome</div></div>
  <div class="card"><img src="/mascot/mascot_reading.webp"><div class="label">Reading / Explaining</div></div>
  <div class="card"><img src="/mascot/mascot_thumbs_up.webp"><div class="label">Thumbs Up</div></div>
  <div class="card"><img src="/mascot/mascot_thinking.webp"><div class="label">Thinking</div></div>
  <div class="card"><img src="/mascot/mascot_presenting.webp"><div class="label">Presenting</div></div>
  <div class="card"><img src="/mascot/mascot_warning.webp"><div class="label">Warning / Attention</div></div>
</div>
</body>
</html>
