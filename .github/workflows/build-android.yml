name: Build Android APK — مافيوسو

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mafioso APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Java JDK ─────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─── 3. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 4. pnpm ─────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # ─── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # ─── 6. Build web app ─────────────────────────────────────────────────────
      - name: Build web app (Vite)
        working-directory: artifacts/mafioso
        env:
          VITE_API_URL: https://seifoooo-mafioso-server.hf.space
          VITE_TURN_URL:      ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_PASSWORD: ${{ secrets.VITE_TURN_PASSWORD }}
        run: |
          pnpm run build:apk
          ls -lh dist/public/

      # ─── 7. Add Android platform ──────────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: artifacts/mafioso
        run: |
          pnpm exec cap add android 2>&1
          ls android/ | head -10
          test -d android/app || (echo "ERROR: android/app not found" && exit 1)

      # ─── 8. Capacitor sync ────────────────────────────────────────────────────
      - name: Sync Capacitor plugins to Android
        working-directory: artifacts/mafioso
        run: pnpm exec cap sync android 2>&1

      # ─── 9. ImageMagick ───────────────────────────────────────────────────────
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ─── 10. Icons + Splash (ALL Android versions) ────────────────────────────
      # MUST run AFTER cap sync so custom assets are never overwritten by Capacitor
      - name: Generate icons and splash screen
        working-directory: artifacts/mafioso
        run: |
          ICON="resources/icon.png"
          RES="android/app/src/main/res"
          BG="#0d0d0d"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon not found at $ICON" && exit 1
          fi

          # ── Remove any XML adaptive-icon files that override our PNGs ──────
          find "${RES}" -name "ic_launcher*.xml" -delete 2>/dev/null || true

          # ── App Icons (all mipmap densities) ────────────────────────────────
          gen_icon() {
            local DIR=$1 SIZE=$2
            mkdir -p "${RES}/${DIR}"
            convert "$ICON" -resize "${SIZE}x${SIZE}^" -gravity center \
              -extent "${SIZE}x${SIZE}" "${RES}/${DIR}/ic_launcher.png"
            cp "${RES}/${DIR}/ic_launcher.png" "${RES}/${DIR}/ic_launcher_round.png"
          }
          gen_icon mipmap-mdpi     48
          gen_icon mipmap-hdpi     72
          gen_icon mipmap-xhdpi    96
          gen_icon mipmap-xxhdpi   144
          gen_icon mipmap-xxxhdpi  192

          # ── Adaptive icon for Android 8+ (API 26+) ──────────────────────────
          mkdir -p "${RES}/drawable" "${RES}/mipmap-anydpi-v26"
          convert "$ICON" -resize 432x432 -background "$BG" \
            -gravity center -extent 512x512 "${RES}/drawable/ic_launcher_foreground.png"

          cat > "${RES}/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@drawable/ic_launcher_foreground"/>
</adaptive-icon>
EOF
          cp "${RES}/mipmap-anydpi-v26/ic_launcher.xml" \
             "${RES}/mipmap-anydpi-v26/ic_launcher_round.xml"

          mkdir -p "${RES}/values"
          cat > "${RES}/values/ic_launcher_background.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#0d0d0d</color>
</resources>
EOF

          # ── Splash screens (portrait + landscape, all densities) ────────────
          # Android 5–11: Capacitor SplashScreen plugin reads drawable-port-*/drawable-land-*
          gen_splash() {
            local DIR=$1 W=$2 H=$3 ICON_SIZE=$4
            mkdir -p "${RES}/${DIR}"
            convert -size "${W}x${H}" "xc:${BG}" \
              \( "$ICON" -resize "${ICON_SIZE}x${ICON_SIZE}" \) \
              -gravity center -composite "${RES}/${DIR}/splash.png"
          }

          gen_splash drawable-port-mdpi     320  480  160
          gen_splash drawable-port-hdpi     480  800  240
          gen_splash drawable-port-xhdpi    720  1280 360
          gen_splash drawable-port-xxhdpi   1080 1920 540
          gen_splash drawable-port-xxxhdpi  1440 2560 720

          gen_splash drawable-land-mdpi     480  320  160
          gen_splash drawable-land-hdpi     800  480  240
          gen_splash drawable-land-xhdpi    1280 720  360
          gen_splash drawable-land-xxhdpi   1920 1080 540
          gen_splash drawable-land-xxxhdpi  2560 1440 720

          # Default fallback splash
          gen_splash drawable               1080 1920 540

          # ── Android 12+ (API 31+) SplashScreen API icon ─────────────────────
          # windowSplashScreenAnimatedIcon: must be ≤512×512, transparent bg
          convert "$ICON" -resize 512x512 -background none \
            -gravity center -extent 512x512 "${RES}/drawable/splash_icon.png"

          cat > "${RES}/values/splash_colors.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="splash_background">#0d0d0d</color>
</resources>
EOF

          mkdir -p "${RES}/values-v31"
          cat > "${RES}/values-v31/splash_styles.xml" <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
        <item name="windowSplashScreenBackground">#0d0d0d</item>
        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
        <item name="windowSplashScreenIconBackgroundColor">#0d0d0d</item>
        <item name="postSplashScreenTheme">@style/AppTheme</item>
    </style>
</resources>
EOF

          echo "✅ Icons + splash generated for all Android versions"

      # ─── 11. Gradle build ─────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/mafioso/android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/mafioso/android/**/gradle-wrapper.properties', 'artifacts/mafioso/android/**/*.gradle', 'artifacts/mafioso/android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: artifacts/mafioso/android
        run: |
          ./gradlew assembleDebug --info --stacktrace --no-daemon 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      # ─── 12. Upload artifacts ─────────────────────────────────────────────────
      - name: Rename and stage APK
        if: success()
        working-directory: artifacts/mafioso
        run: |
          APK_IN="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_IN" || (find android/app/build -name "*.apk" 2>/dev/null; exit 1)
          DATE=$(date +%Y%m%d-%H%M)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="mafioso-v${{ github.run_number }}-${DATE}-${SHA}.apk"
          mkdir -p apk-output
          cp "$APK_IN" "apk-output/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "APK: ${APK_NAME} ($(du -sh apk-output/${APK_NAME} | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafioso-apk-run${{ github.run_number }}
          path: artifacts/mafioso/apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-run${{ github.run_number }}
          path: artifacts/mafioso/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Show build log on failure
        if: failure()
        run: tail -150 artifacts/mafioso/build.log 2>/dev/null || echo "(log unavailable)"
