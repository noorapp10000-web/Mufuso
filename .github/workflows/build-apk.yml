name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        env:
          VITE_API_URL: https://seifoooo-mafioso-server.hf.space
        run: pnpm --filter @workspace/mafioso run build:apk

      - name: Add Android platform
        working-directory: artifacts/mafioso
        run: npx cap add android

      - name: Apply custom splash screen & colors
        run: |
          RES=artifacts/mafioso/android/app/src/main/res
          SRC=artifacts/mafioso/android-assets/res

          # Copy splash PNGs for all densities
          for dir in drawable drawable-land-hdpi drawable-land-mdpi drawable-land-xhdpi \
                     drawable-land-xxhdpi drawable-land-xxxhdpi \
                     drawable-port-hdpi drawable-port-mdpi drawable-port-xhdpi \
                     drawable-port-xxhdpi drawable-port-xxxhdpi drawable-v21; do
            mkdir -p "$RES/$dir"
            [ -f "$SRC/$dir/splash.png" ] && cp "$SRC/$dir/splash.png" "$RES/$dir/splash.png"
            [ -f "$SRC/$dir/splash.xml" ] && cp "$SRC/$dir/splash.xml" "$RES/$dir/splash.xml"
          done

          # Copy ic_splash_logo and fallback splash
          cp "$SRC/drawable/ic_splash_logo.png" "$RES/drawable/ic_splash_logo.png"
          cp "$SRC/drawable/splash.png" "$RES/drawable/splash.png"

          # Merge colors into existing colors.xml
          if [ -f "$RES/values/colors.xml" ]; then
            sed -i 's|</resources>||' "$RES/values/colors.xml"
            echo '    <color name="splashBackground">#CC0000</color>' >> "$RES/values/colors.xml"
            echo '</resources>' >> "$RES/values/colors.xml"
          else
            cp "$SRC/values/colors.xml" "$RES/values/colors.xml"
          fi

      - name: Sync Capacitor
        working-directory: artifacts/mafioso
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: artifacts/mafioso/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafioso-debug
          path: artifacts/mafioso/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
