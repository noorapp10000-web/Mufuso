name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        env:
          VITE_API_URL: https://seifoooo-mafioso-server.hf.space
        run: pnpm --filter @workspace/mafioso run build:apk

      - name: Add Android platform
        working-directory: artifacts/mafioso
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: artifacts/mafioso
        run: npx cap sync android

      # Icons + Splash — MUST run AFTER cap sync so Capacitor never overwrites them
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate icons and splash screen
        working-directory: artifacts/mafioso
        run: |
          ICON="resources/icon.png"
          RES="android/app/src/main/res"
          BG="#0d0d0d"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon not found at $ICON" && exit 1
          fi

          # Remove any XML adaptive-icon files that would override our PNGs
          find "${RES}" -name "ic_launcher*.xml" -delete 2>/dev/null || true

          # App Icons — all mipmap densities
          gen_icon() {
            local DIR=$1 SIZE=$2
            mkdir -p "${RES}/${DIR}"
            convert "$ICON" -resize "${SIZE}x${SIZE}^" -gravity center \
              -extent "${SIZE}x${SIZE}" "${RES}/${DIR}/ic_launcher.png"
            cp "${RES}/${DIR}/ic_launcher.png" "${RES}/${DIR}/ic_launcher_round.png"
          }
          gen_icon mipmap-mdpi     48
          gen_icon mipmap-hdpi     72
          gen_icon mipmap-xhdpi    96
          gen_icon mipmap-xxhdpi   144
          gen_icon mipmap-xxxhdpi  192

          # Adaptive icon — Android 8+ (API 26+)
          mkdir -p "${RES}/drawable" "${RES}/mipmap-anydpi-v26"
          convert "$ICON" -resize 432x432 -background "$BG" \
            -gravity center -extent 512x512 "${RES}/drawable/ic_launcher_foreground.png"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/ic_launcher_background"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > "${RES}/mipmap-anydpi-v26/ic_launcher.xml"
          cp "${RES}/mipmap-anydpi-v26/ic_launcher.xml" \
             "${RES}/mipmap-anydpi-v26/ic_launcher_round.xml"

          mkdir -p "${RES}/values"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#0d0d0d</color>' \
            '</resources>' \
            > "${RES}/values/ic_launcher_background.xml"

          # Splash screens — portrait + landscape, all densities
          # Android 5-11: Capacitor SplashScreen reads drawable-port-*/drawable-land-*
          gen_splash() {
            local DIR=$1 W=$2 H=$3 ICON_SIZE=$4
            mkdir -p "${RES}/${DIR}"
            convert -size "${W}x${H}" "xc:${BG}" \
              \( "$ICON" -resize "${ICON_SIZE}x${ICON_SIZE}" \) \
              -gravity center -composite "${RES}/${DIR}/splash.png"
          }

          gen_splash drawable-port-mdpi     320  480  160
          gen_splash drawable-port-hdpi     480  800  240
          gen_splash drawable-port-xhdpi    720  1280 360
          gen_splash drawable-port-xxhdpi   1080 1920 540
          gen_splash drawable-port-xxxhdpi  1440 2560 720

          gen_splash drawable-land-mdpi     480  320  160
          gen_splash drawable-land-hdpi     800  480  240
          gen_splash drawable-land-xhdpi    1280 720  360
          gen_splash drawable-land-xxhdpi   1920 1080 540
          gen_splash drawable-land-xxxhdpi  2560 1440 720

          gen_splash drawable               1080 1920 540

          # Android 12+ (API 31+) — splash icon, transparent bg, max 512x512
          convert "$ICON" -resize 512x512 -background none \
            -gravity center -extent 512x512 "${RES}/drawable/splash_icon.png"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="splash_background">#0d0d0d</color>' \
            '</resources>' \
            > "${RES}/values/splash_colors.xml"

          mkdir -p "${RES}/values-v31"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">' \
            '        <item name="windowSplashScreenBackground">#0d0d0d</item>' \
            '        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>' \
            '        <item name="windowSplashScreenIconBackgroundColor">#0d0d0d</item>' \
            '        <item name="postSplashScreenTheme">@style/AppTheme</item>' \
            '    </style>' \
            '</resources>' \
            > "${RES}/values-v31/splash_styles.xml"

          echo "Icons + splash generated for all Android versions"

      - name: Build Debug APK
        working-directory: artifacts/mafioso/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafioso-debug
          path: artifacts/mafioso/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
