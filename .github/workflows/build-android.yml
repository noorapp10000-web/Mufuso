name: Build Android APK — مافيوسو

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mafioso APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Java JDK ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ─── 3. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 4. pnpm ─────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # ─── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install workspace dependencies
        run: |
          echo "=== Installing dependencies ==="
          pnpm install --no-frozen-lockfile
          echo "=== Done ==="

      # ─── 6. Build web app ─────────────────────────────────────────────────────
      - name: Build web app (Vite)
        working-directory: artifacts/mafioso
        run: |
          echo "=== Building web app for APK ==="
          pnpm run build:apk
          echo "=== Build output ==="
          du -sh dist/public/
          echo "Files: $(find dist/public -name '*.js' -o -name '*.css' | wc -l) bundles"

      # ─── 7. Add Android platform ──────────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: artifacts/mafioso
        run: |
          echo "=== Adding Android platform ==="
          pnpm exec cap add android
          echo "=== Android platform added ==="

      # ─── 8. App icons via ImageMagick ─────────────────────────────────────────
      - name: Generate app icons with ImageMagick
        working-directory: artifacts/mafioso
        run: |
          echo "=== Generating launcher icons ==="
          ICON_SRC="resources/icon.png"
          RES_DIR="android/app/src/main/res"

          # Icon sizes and their directory names
          declare -A ICON_SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for dir in "${!ICON_SIZES[@]}"; do
            size=${ICON_SIZES[$dir]}
            mkdir -p "${RES_DIR}/${dir}"
            # Square icon
            convert "$ICON_SRC" -resize "${size}x${size}" \
              "${RES_DIR}/${dir}/ic_launcher.png"
            # Round icon (circular crop)
            convert "$ICON_SRC" -resize "${size}x${size}" \
              \( +clone -alpha extract \
                 -draw "fill black rectangle 0,0 ${size},${size} fill white circle $((size/2)),$((size/2)) $((size/2)),0" \
                 -alpha off -compose CopyOpacity -composite \) \
              "${RES_DIR}/${dir}/ic_launcher_round.png"
            echo "  ✓ ${dir} — ${size}x${size}"
          done

          # Foreground icon for adaptive icons (512x512 with padding)
          mkdir -p "${RES_DIR}/mipmap-anydpi-v26"
          convert "$ICON_SRC" -resize "432x432" -background '#0d0d0d' \
            -gravity center -extent 512x512 \
            "${RES_DIR}/drawable/ic_launcher_foreground.png"

          # Adaptive icon XML
          cat > "${RES_DIR}/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > "${RES_DIR}/mipmap-anydpi-v26/ic_launcher_round.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # App icon background color
          mkdir -p "${RES_DIR}/values"
          grep -q "ic_launcher_background" "${RES_DIR}/values/colors.xml" 2>/dev/null || \
            sed -i 's|</resources>|    <color name="ic_launcher_background">#0d0d0d</color>\n</resources>|' \
              "${RES_DIR}/values/colors.xml" 2>/dev/null || \
            cat > "${RES_DIR}/values/ic_launcher_colors.xml" << 'COLOREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0d0d0d</color>
          </resources>
          COLOREOF

          echo "=== Icon generation complete ==="

      # ─── 9. Splash screen ─────────────────────────────────────────────────────
      - name: Generate splash screen
        working-directory: artifacts/mafioso
        run: |
          echo "=== Creating splash screen ==="
          ICON_SRC="resources/icon.png"
          RES_DIR="android/app/src/main/res"
          mkdir -p "${RES_DIR}/drawable"

          # Dark background with centered logo (standard portrait splash)
          convert -size 1080x1920 xc:"#0d0d0d" \
            \( "$ICON_SRC" -resize 500x500 \) \
            -gravity center -composite \
            "${RES_DIR}/drawable/splash.png"

          # Landscape variant
          mkdir -p "${RES_DIR}/drawable-land"
          convert -size 1920x1080 xc:"#0d0d0d" \
            \( "$ICON_SRC" -resize 400x400 \) \
            -gravity center -composite \
            "${RES_DIR}/drawable-land/splash.png"

          # Set splash background color in values
          cat > "${RES_DIR}/values/splash_colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splash_background">#0d0d0d</color>
          </resources>
          EOF

          echo "=== Splash screen created ==="
          echo "Portrait: $(du -sh ${RES_DIR}/drawable/splash.png | cut -f1)"
          echo "Landscape: $(du -sh ${RES_DIR}/drawable-land/splash.png | cut -f1)"

      # ─── 10. Capacitor sync ───────────────────────────────────────────────────
      - name: Sync Capacitor plugins
        working-directory: artifacts/mafioso
        run: |
          echo "=== Syncing Capacitor ==="
          pnpm exec cap sync android
          echo "=== Sync complete ==="

      # ─── 11. Gradle permissions ───────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/mafioso/android
        run: chmod +x gradlew

      # ─── 12. Cache Gradle ─────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ─── 13. Build APK ────────────────────────────────────────────────────────
      - name: Build debug APK (verbose)
        working-directory: artifacts/mafioso/android
        run: |
          echo "=== Environment info ==="
          java -version 2>&1
          ./gradlew --version 2>&1
          echo ""
          echo "=== Building APK ==="
          ./gradlew assembleDebug \
            --info \
            --stacktrace \
            --no-daemon \
            2>&1 | tee ../../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Gradle exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT

      # ─── 14. Verify & rename APK ──────────────────────────────────────────────
      - name: Verify APK and rename
        working-directory: artifacts/mafioso
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ APK not found"
            find android/app/build -name "*.apk" 2>/dev/null || echo "No APKs found anywhere"
            exit 1
          fi

          BUILD_DATE=$(date +%Y%m%d-%H%M)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="mafioso-v${{ github.run_number }}-${BUILD_DATE}-${SHORT_SHA}.apk"
          mkdir -p apk-output
          cp "$APK" "apk-output/${APK_NAME}"

          echo "✅ APK ready"
          echo "   Name : ${APK_NAME}"
          echo "   Size : $(du -sh apk-output/${APK_NAME} | cut -f1)"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      # ─── 15. Upload APK artifact ──────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafioso-apk-run${{ github.run_number }}
          path: artifacts/mafioso/apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      # ─── 16. Upload build log (always) ────────────────────────────────────────
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-run${{ github.run_number }}
          path: artifacts/mafioso/build.log
          retention-days: 14
          if-no-files-found: warn

      # ─── 17. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║         MAFIOSO APK — BUILD SUMMARY              ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  %-15s : %-30s ║\n" "Run"     "#${{ github.run_number }}"
          printf "║  %-15s : %-30s ║\n" "Commit"  "$(echo '${{ github.sha }}' | cut -c1-7)"
          printf "║  %-15s : %-30s ║\n" "Branch"  "${{ github.ref_name }}"
          printf "║  %-15s : %-30s ║\n" "Trigger" "${{ github.event_name }}"
          printf "║  %-15s : %-30s ║\n" "Date"    "$(date '+%Y-%m-%d %H:%M')"
          echo "╠══════════════════════════════════════════════════╣"
          if [ -n "$APK_NAME" ] && [ -f "artifacts/mafioso/apk-output/$APK_NAME" ]; then
            APK_SIZE=$(du -sh "artifacts/mafioso/apk-output/$APK_NAME" | cut -f1)
            printf "║  %-15s : %-30s ║\n" "STATUS"  "✅ SUCCESS"
            printf "║  %-15s : %-30s ║\n" "APK name" "$APK_NAME"
            printf "║  %-15s : %-30s ║\n" "APK size" "$APK_SIZE"
          else
            printf "║  %-15s : %-30s ║\n" "STATUS"  "❌ FAILED"
          fi
          echo "╚══════════════════════════════════════════════════╝"

      # ─── 18. On failure: show log tail ────────────────────────────────────────
      - name: Show build log tail (on failure)
        if: failure()
        run: |
          echo "=== Last 150 lines of build log ==="
          tail -150 artifacts/mafioso/build.log 2>/dev/null || echo "Log unavailable"
