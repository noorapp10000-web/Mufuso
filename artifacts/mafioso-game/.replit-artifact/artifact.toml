kind = "web"
previewPath = "/"
title = "Mafioso: القضية الغامضة"
version = "1.0.0"
id = "artifacts/mafioso-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22231

[services.development]
run = "pnpm --filter @workspace/mafioso-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mafioso-game", "run", "build" ]
publicDir = "artifacts/mafioso-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22231"
BASE_PATH = "/"
