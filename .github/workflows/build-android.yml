name: Build Android APK — مافيوسو

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mafioso APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Java JDK ─────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─── 3. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ─── 4. pnpm ─────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # ─── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install workspace dependencies
        run: |
          echo "=== Installing dependencies ==="
          pnpm install --no-frozen-lockfile 2>&1
          echo "=== Install complete ==="

      # ─── 6. Build web app ─────────────────────────────────────────────────────
      - name: Build web app (Vite)
        working-directory: artifacts/mafioso
        run: |
          echo "=== Building web app for APK ==="
          pnpm run build:apk
          echo "=== Build output ==="
          ls -lh dist/public/
          echo "Bundles: $(find dist/public -name '*.js' -o -name '*.css' | wc -l)"

      # ─── 7. Add Android platform ──────────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: artifacts/mafioso
        run: |
          echo "=== Adding Android platform ==="
          pnpm exec cap add android 2>&1
          echo "=== Verifying android folder ==="
          ls android/ | head -10
          test -d android/app || (echo "ERROR: android/app not found" && exit 1)

      # ─── 8. Capacitor sync (MUST happen before icons/splash) ──────────────────
      - name: Sync Capacitor plugins to Android
        working-directory: artifacts/mafioso
        run: |
          echo "=== Syncing Capacitor ==="
          pnpm exec cap sync android 2>&1
          echo "=== Sync complete ==="

      # ─── 9. ImageMagick ───────────────────────────────────────────────────────
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ─── 10. Icons + Splash (AFTER cap sync — sync overwrites drawables) ───────
      - name: Generate icons and splash screen
        working-directory: artifacts/mafioso
        run: |
          echo "=== Generating icons & splash with ImageMagick ==="
          ICON_SRC="resources/icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON_SRC" ]; then
            echo "ERROR: Icon not found at $ICON_SRC"
            exit 1
          fi
          echo "Icon size: $(identify -format '%wx%h' $ICON_SRC)"

          # ── Remove all default XML icon overrides from cap sync ──────────────
          find "${RES}" -name "ic_launcher*.xml" -delete
          find "${RES}" -name "ic_launcher_foreground.xml" -delete
          find "${RES}" -name "ic_launcher_background.xml" -delete
          echo "  ✓ Removed default XML icon overrides"

          # ── Launcher icons per density ───────────────────────────────────────
          generate_icon() {
            local DIR=$1 SIZE=$2
            mkdir -p "${RES}/${DIR}"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "${RES}/${DIR}/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "${RES}/${DIR}/ic_launcher_round.png"
            echo "  ✓ ${DIR}: ${SIZE}x${SIZE}"
          }

          generate_icon mipmap-mdpi    48
          generate_icon mipmap-hdpi    72
          generate_icon mipmap-xhdpi   96
          generate_icon mipmap-xxhdpi  144
          generate_icon mipmap-xxxhdpi 192

          # ── Adaptive icon foreground (logo on dark bg, 432px centered in 512px) ─
          mkdir -p "${RES}/drawable" "${RES}/mipmap-anydpi-v26"
          convert "$ICON_SRC" -resize 432x432^ -gravity center -extent 432x432 \
            -background '#0d0d0d' -gravity center -extent 512x512 \
            "${RES}/drawable/ic_launcher_foreground.png"
          echo "  ✓ drawable/ic_launcher_foreground.png"

          # ── Adaptive icon XMLs ───────────────────────────────────────────────
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/ic_launcher_background"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > "${RES}/mipmap-anydpi-v26/ic_launcher.xml"
          cp "${RES}/mipmap-anydpi-v26/ic_launcher.xml" \
             "${RES}/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "  ✓ adaptive icon XMLs"

          # ── Background color for launcher icon ───────────────────────────────
          mkdir -p "${RES}/values"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#0d0d0d</color>' \
            '</resources>' \
            > "${RES}/values/ic_launcher_background.xml"
          echo "  ✓ ic_launcher_background color"

          # ── Portrait splash (red background + logo, all Android versions) ────
          mkdir -p "${RES}/drawable" "${RES}/drawable-land"
          convert -size 1080x1920 xc:'#8B0000' \
            \( "$ICON_SRC" -resize 500x500 \) \
            -gravity center -composite \
            "${RES}/drawable/splash.png"
          echo "  ✓ Portrait splash: $(du -sh ${RES}/drawable/splash.png | cut -f1)"

          # ── Landscape splash ─────────────────────────────────────────────────
          convert -size 1920x1080 xc:'#8B0000' \
            \( "$ICON_SRC" -resize 400x400 \) \
            -gravity center -composite \
            "${RES}/drawable-land/splash.png"
          echo "  ✓ Landscape splash: $(du -sh ${RES}/drawable-land/splash.png | cut -f1)"

          # ── Splash icon for Android 12+ (logo on red bg, full opaque square) ─
          # Android 12+ uses windowSplashScreenAnimatedIcon; it must be fully
          # opaque (no transparency) to avoid the white circle background.
          convert -size 512x512 xc:'#8B0000' \
            \( "$ICON_SRC" -resize 360x360 \) \
            -gravity center -composite \
            "${RES}/drawable/splash_icon.png"
          echo "  ✓ Android 12+ splash icon: $(du -sh ${RES}/drawable/splash_icon.png | cut -f1)"

          # ── Splash background color ───────────────────────────────────────────
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="splash_background">#8B0000</color>' \
            '</resources>' \
            > "${RES}/values/splash_colors.xml"
          echo "  ✓ splash_colors.xml"

          # ── Android 12+ splash theme (values-v31) ────────────────────────────
          mkdir -p "${RES}/values-v31"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">' \
            '        <item name="windowSplashScreenBackground">#8B0000</item>' \
            '        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>' \
            '        <item name="windowSplashScreenIconBackgroundColor">#8B0000</item>' \
            '        <item name="postSplashScreenTheme">@style/AppTheme</item>' \
            '    </style>' \
            '</resources>' \
            > "${RES}/values-v31/splash_styles.xml"
          echo "  ✓ Android 12+ splash theme (values-v31)"

          echo "=== Icons + splash generation complete ==="

      # ─── 11. Gradle permissions ───────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/mafioso/android/gradlew

      # ─── 12. Cache Gradle ─────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/mafioso/android/**/gradle-wrapper.properties', 'artifacts/mafioso/android/**/*.gradle', 'artifacts/mafioso/android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ─── 13. Build APK ────────────────────────────────────────────────────────
      - name: Build debug APK (verbose)
        working-directory: artifacts/mafioso/android
        run: |
          echo "=== Environment ==="
          java -version 2>&1
          ./gradlew --version 2>&1
          echo ""
          echo "=== Building APK ==="
          ./gradlew assembleDebug \
            --info \
            --stacktrace \
            --no-daemon \
            2>&1 | tee ../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Exit code: $BUILD_EXIT ==="
          exit $BUILD_EXIT

      # ─── 14. Rename & stage APK ───────────────────────────────────────────────
      - name: Rename and stage APK
        if: success()
        working-directory: artifacts/mafioso
        run: |
          APK_IN="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_IN" ]; then
            echo "ERROR: APK not found"
            find android/app/build -name "*.apk" 2>/dev/null
            exit 1
          fi
          DATE=$(date +%Y%m%d-%H%M)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="mafioso-v${{ github.run_number }}-${DATE}-${SHA}.apk"
          mkdir -p apk-output
          cp "$APK_IN" "apk-output/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "✅ APK: ${APK_NAME} ($(du -sh apk-output/${APK_NAME} | cut -f1))"

      # ─── 15. Upload APK ───────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafioso-apk-run${{ github.run_number }}
          path: artifacts/mafioso/apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      # ─── 16. Upload build log (always) ────────────────────────────────────────
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-run${{ github.run_number }}
          path: artifacts/mafioso/build.log
          retention-days: 14
          if-no-files-found: warn

      # ─── 17. Summary ──────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║         MAFIOSO APK — BUILD SUMMARY              ║"
          echo "╠══════════════════════════════════════════════════╣"
          printf "║  %-15s : %-30s ║\n" "Run"     "#${{ github.run_number }}"
          printf "║  %-15s : %-30s ║\n" "Commit"  "$(echo '${{ github.sha }}' | cut -c1-7)"
          printf "║  %-15s : %-30s ║\n" "Branch"  "${{ github.ref_name }}"
          printf "║  %-15s : %-30s ║\n" "Trigger" "${{ github.event_name }}"
          printf "║  %-15s : %-30s ║\n" "Date"    "$(date '+%Y-%m-%d %H:%M')"
          echo "╠══════════════════════════════════════════════════╣"
          if [ -n "$APK_NAME" ]; then
            APK_PATH="artifacts/mafioso/apk-output/$APK_NAME"
            if [ -f "$APK_PATH" ]; then
              APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
              printf "║  %-15s : %-30s ║\n" "STATUS"   "✅ SUCCESS"
              printf "║  %-15s : %-30s ║\n" "APK"      "$APK_NAME"
              printf "║  %-15s : %-30s ║\n" "APK size" "$APK_SIZE"
            fi
          else
            printf "║  %-15s : %-30s ║\n" "STATUS"   "❌ FAILED"
          fi
          echo "╚══════════════════════════════════════════════════╝"

      # ─── 18. Show log tail on failure ─────────────────────────────────────────
      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== Last 150 lines of build log ==="
          tail -150 artifacts/mafioso/build.log 2>/dev/null || echo "(log unavailable)"
