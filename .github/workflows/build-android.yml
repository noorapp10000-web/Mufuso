name: Build Android APK — مافيوسو

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mafioso APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Java JDK ─────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─── 3. Node.js ──────────────────────────────────────────────────────────
      # Node 20 LTS — sharp@0.32.x has no prebuilt binaries for Node 22
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─── 4. pnpm ─────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # ─── 5. Install dependencies ──────────────────────────────────────────────
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # ─── 6. Build web app ─────────────────────────────────────────────────────
      - name: Build web app (Vite)
        working-directory: artifacts/mafioso
        env:
          VITE_API_URL: https://seifoooo-mafioso-server.hf.space
          # Optional: override default OpenRelay TURN with your own server
          # Set these in GitHub → Settings → Secrets → Actions
          VITE_TURN_URL:      ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_PASSWORD: ${{ secrets.VITE_TURN_PASSWORD }}
        run: |
          pnpm run build:apk
          ls -lh dist/public/

      # ─── 7. Add Android platform ──────────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: artifacts/mafioso
        run: |
          pnpm exec cap add android 2>&1
          ls android/ | head -10
          test -d android/app || (echo "ERROR: android/app not found" && exit 1)

      # ─── 8. Capacitor sync ────────────────────────────────────────────────────
      - name: Sync Capacitor plugins to Android
        working-directory: artifacts/mafioso
        run: pnpm exec cap sync android 2>&1

      # ─── 9. Microphone permissions (AFTER sync so they are never overwritten) ─
      - name: Add microphone permissions to AndroidManifest
        working-directory: artifacts/mafioso
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in "android.permission.RECORD_AUDIO" "android.permission.MODIFY_AUDIO_SETTINGS"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<uses-permission android:name=\"android.permission.INTERNET\"|<uses-permission android:name=\"$PERM\" />\n    <uses-permission android:name=\"android.permission.INTERNET\"|" "$MANIFEST"
              echo "  Added: $PERM"
            else
              echo "  Already present: $PERM"
            fi
          done
          grep "uses-permission" "$MANIFEST"

      # ─── 10. Patch MainActivity — request mic at runtime (Android 6+) ─────────
      # Using base64 to avoid << heredoc conflicting with YAML parser
      - name: Patch MainActivity for microphone runtime permission
        working-directory: artifacts/mafioso
        run: |
          MAIN="android/app/src/main/java/com/mafioso/game/MainActivity.java"
          echo "" | base64 -d > "$MAIN"
          echo "  MainActivity patched — contents:"
          cat "$MAIN"

      # ─── 11. ImageMagick ──────────────────────────────────────────────────────
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # ─── 12. Icons + Splash ───────────────────────────────────────────────────
      - name: Generate icons and splash screen
        working-directory: artifacts/mafioso
        run: |
          ICON_SRC="resources/icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON_SRC" ]; then
            echo "ERROR: Icon not found at $ICON_SRC"
            exit 1
          fi

          find "${RES}" -name "ic_launcher*.xml" -delete
          find "${RES}" -name "ic_launcher_foreground.xml" -delete
          find "${RES}" -name "ic_launcher_background.xml" -delete

          generate_icon() {
            local DIR=$1 SIZE=$2
            mkdir -p "${RES}/${DIR}"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "${RES}/${DIR}/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "${RES}/${DIR}/ic_launcher_round.png"
          }

          generate_icon mipmap-mdpi    48
          generate_icon mipmap-hdpi    72
          generate_icon mipmap-xhdpi   96
          generate_icon mipmap-xxhdpi  144
          generate_icon mipmap-xxxhdpi 192

          mkdir -p "${RES}/drawable" "${RES}/mipmap-anydpi-v26"
          convert "$ICON_SRC" -resize 432x432^ -gravity center -extent 432x432 \
            -background '#0d0d0d' -gravity center -extent 512x512 \
            "${RES}/drawable/ic_launcher_foreground.png"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@color/ic_launcher_background"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > "${RES}/mipmap-anydpi-v26/ic_launcher.xml"
          cp "${RES}/mipmap-anydpi-v26/ic_launcher.xml" "${RES}/mipmap-anydpi-v26/ic_launcher_round.xml"

          mkdir -p "${RES}/values"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="ic_launcher_background">#0d0d0d</color>' \
            '</resources>' \
            > "${RES}/values/ic_launcher_background.xml"

          mkdir -p "${RES}/drawable" "${RES}/drawable-land"
          convert -size 1080x1920 xc:'#8B0000' \
            \( "$ICON_SRC" -resize 500x500 \) \
            -gravity center -composite "${RES}/drawable/splash.png"

          convert -size 1920x1080 xc:'#8B0000' \
            \( "$ICON_SRC" -resize 400x400 \) \
            -gravity center -composite "${RES}/drawable-land/splash.png"

          convert -size 512x512 xc:'#8B0000' \
            \( "$ICON_SRC" -resize 360x360 \) \
            -gravity center -composite "${RES}/drawable/splash_icon.png"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <color name="splash_background">#8B0000</color>' \
            '</resources>' \
            > "${RES}/values/splash_colors.xml"

          mkdir -p "${RES}/values-v31"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">' \
            '        <item name="windowSplashScreenBackground">#8B0000</item>' \
            '        <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>' \
            '        <item name="windowSplashScreenIconBackgroundColor">#8B0000</item>' \
            '        <item name="postSplashScreenTheme">@style/AppTheme</item>' \
            '    </style>' \
            '</resources>' \
            > "${RES}/values-v31/splash_styles.xml"

          echo "Icons + splash done"

      # ─── 13. Gradle build ─────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/mafioso/android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/mafioso/android/**/gradle-wrapper.properties', 'artifacts/mafioso/android/**/*.gradle', 'artifacts/mafioso/android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: artifacts/mafioso/android
        run: |
          ./gradlew assembleDebug --info --stacktrace --no-daemon 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      # ─── 14. Upload artifacts ─────────────────────────────────────────────────
      - name: Rename and stage APK
        if: success()
        working-directory: artifacts/mafioso
        run: |
          APK_IN="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_IN" || (find android/app/build -name "*.apk" 2>/dev/null; exit 1)
          DATE=$(date +%Y%m%d-%H%M)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_NAME="mafioso-v${{ github.run_number }}-${DATE}-${SHA}.apk"
          mkdir -p apk-output
          cp "$APK_IN" "apk-output/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "APK: ${APK_NAME} ($(du -sh apk-output/${APK_NAME} | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mafioso-apk-run${{ github.run_number }}
          path: artifacts/mafioso/apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-run${{ github.run_number }}
          path: artifacts/mafioso/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Show build log on failure
        if: failure()
        run: tail -150 artifacts/mafioso/build.log 2>/dev/null || echo "(log unavailable)"
